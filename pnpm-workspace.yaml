packages:
  - packages/*
  - apps/*
  - templates/*
  - fixtures/*

# Versions shared across workspaces. Revalidate before every release (see D08).
# TypeScript stays on 6.0.x because typescript-eslint still requires `typescript <6.1.0`.
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@eslint/js': ^10.0.1
  '@stylistic/eslint-plugin': ^5.10.0
  '@types/estree': ^1.0.9
  '@types/node': ^24.19.2
  eslint: ^10.12.0
  jiti: ^2.7.0
  prettier: ^3.9.10
  publint: ^0.3.25
  tsdown: ^0.23.1
  typescript: ~6.0.3
  typescript-eslint: ^8.71.1
  vite: ^8.3.4
  vitest: ^5.0.3
