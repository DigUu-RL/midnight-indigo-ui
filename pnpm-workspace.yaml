packages:
  - packages/*
  - apps/*
  - templates/*
  - fixtures/*

# Versions shared across workspaces. Revalidate before every release (see D08).
# TypeScript stays on 6.0.x because typescript-eslint still requires `typescript <6.1.0`.
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@emotion/cache': ^11.14.0
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  '@eslint/js': ^10.0.1
  '@fontsource-variable/geist': ^5.3.0
  '@fontsource-variable/geist-mono': ^5.3.0
  '@iconify-json/tabler': ^1.2.42
  '@mui/material': ^9.5.0
  '@mui/material-nextjs': ^9.5.0
  '@mui/x-date-pickers': ~9.14.0
  '@playwright/test': ~1.63.0
  '@stylistic/eslint-plugin': ^5.10.0
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/estree': ^1.0.9
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/react-transition-group': ^4.4.12
  axe-core: ~4.13.0
  date-fns: ^4.4.0
  echarts: ^6.1.0
  eslint: ^10.12.0
  i18next: ^26.4.3
  jiti: ^2.7.0
  jsdom: ^30.1.2
  next: ^16.4.0
  prettier: ^3.9.10
  publint: ^0.3.25
  react: ^19.3.0
  react-dom: ^19.3.0
  react-hook-form: ~7.89.0
  react-i18next: ^17.0.16
  tsdown: ^0.23.1
  typescript: ~6.0.3
  typescript-eslint: ^8.71.1
  vite: ^8.3.4
  vitest: ^5.0.3

