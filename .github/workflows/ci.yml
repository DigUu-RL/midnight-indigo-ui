name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Provisional matrix; the definitive support policy is tracked in D08.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:performance
      - run: pnpm check:package
      - run: pnpm check:source
      - run: pnpm check:licenses
      # Bundle budgets (bundle-budgets.json); the size report goes to the job summary.
      - run: pnpm check:bundle

      - name: No generated files outside .gitignore
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi

  # The starter as a user gets it: a copy generated outside the monorepo with the local build of the library
  # (`pnpm create:starter --pack`), installed from the registry, built and served, every page requested in each locale.
  starter:
    name: generated starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @midnight-indigo/ui run build
      - run: pnpm check:starter

  # End-to-end flows, accessibility, visual regression and performance in Chromium, on the production builds. Linux
  # only: the visual baselines in CI are the Linux set. After an intentional visual change, add the
  # `update-visual-baselines` label to the pull request (update-visual-baselines.yml commits the new set).
  browser:
    name: browser (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @midnight-indigo/browser-tests exec playwright install --with-deps chromium

      - run: pnpm --filter @midnight-indigo/browser-tests run test:e2e
      - run: pnpm --filter @midnight-indigo/browser-tests run test:visual
        if: ${{ !cancelled() }}
      - run: pnpm --filter @midnight-indigo/browser-tests run test:performance
        if: ${{ !cancelled() }}

      # The report holds traces of failures, the visual diffs and the measurements of the performance tests.
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            fixtures/browser/playwright-report/
            fixtures/browser/test-results/
          retention-days: 14
